services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-multimodal
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag_network

  viz:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-viz
    command: ["streamlit", "run", "3dv.py",
              "--server.address=0.0.0.0",
              "--server.port=8502",
              "--server.maxUploadSize=10"]
    ports:
      - "8502:8502"
    env_file:
      - .env
    volumes:
      - media_data:/app/media
      - snap_data:/app/snapshots
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag_network

  transformer-explainer:
    build:
      context: .
      dockerfile: transformer-explainer.Dockerfile
    container_name: rag-transformer-explainer
    ports:
      - "8503:80"
    restart: unless-stopped
    networks:
      - rag_network

  db:
    image: pgvector/pgvector:pg16
    container_name: rag-pgvector-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword42
      POSTGRES_DB: rag_db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - rag_network

volumes:
  media_data:
  db_data:
  snap_data:

networks:
  rag_network:
    driver: bridge