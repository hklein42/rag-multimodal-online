[server]
# Upload-Limit auf 300 MB erhöhen (Dateien bis 250 MB müssen durchgehen)
maxUploadSize = 300
enableXsrfProtection = true
headless = true
address = "0.0.0.0"
port = 8501
 
[browser]
gatherUsageStats = false
 
[theme]
base = "dark"
primaryColor = "#4F8EF7"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1C2033"
textColor = "#FAFAFA"
font = "sans serif"
 